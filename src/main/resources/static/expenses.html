<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spendex — Expense History</title>
  <meta name="description" content="Browse, filter, and manage all your recorded expenses.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="toast-container"></div>

<div class="app-shell">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">SPENDEX</span>
      <span class="brand-sub">Personal Finance</span>
    </div>
    <nav class="nav">
      <a href="/"              class="nav-item">Overview</a>
      <a href="/expenses.html" class="nav-item active">Expenses</a>
      <a href="/add.html"      class="nav-item">Add Expense</a>
      <a href="/investments.html" class="nav-item">Investments</a>
      <a href="/reports.html"  class="nav-item">Reports</a>
    </nav>
    <div class="sidebar-footer">Spendex · 2026</div>
  </aside>

  <!-- ── MAIN ── -->
  <main class="main-content">

    <div class="anim d0">
      <p class="page-eyebrow">Transaction History</p>
    </div>

    <div class="anim d1">
      <h1 class="page-title">All Expenses</h1>
      <p class="page-subtitle">Filter, search, and manage your spending records.</p>
    </div>

    <hr class="divider anim d2">

    <!-- ── FILTER BAR ── -->
    <div class="filter-bar anim d3">

      <div class="filter-group">
        <label class="filter-label" for="f-category">Category</label>
        <select class="filter-select" id="f-category">
          <option value="">All Categories</option>
          <option>Food</option>
          <option>Transport</option>
          <option>Shopping</option>
          <option>Bills</option>
          <option>Education</option>
          <option>Entertainment</option>
          <option>Travel</option>
          <option>Healthcare</option>
          <option>Other</option>
        </select>
      </div>

      <div class="filter-group">
        <label class="filter-label" for="f-month">Month</label>
        <select class="filter-select" id="f-month" style="min-width:140px;">
          <option value="">All Months</option>
        </select>
      </div>

      <div class="filter-group">
        <label class="filter-label" for="f-year">Year</label>
        <select class="filter-select" id="f-year" style="min-width:110px;">
          <option value="">All Years</option>
        </select>
      </div>

      <div class="filter-group">
        <label class="filter-label" for="f-search">Search</label>
        <input type="search" class="search-input" id="f-search"
               placeholder="Description…" autocomplete="off" style="min-width:180px;">
      </div>

      <span class="result-count" id="result-count"></span>
    </div>

    <!-- ── TABLE HEADER ── -->
    <div class="tx-header" id="tx-header" style="display:none;">
      <span class="tx-hcell">Date</span>
      <span class="tx-hcell">Category</span>
      <span class="tx-hcell">Description</span>
      <span class="tx-hcell right">Amount</span>
      <span class="tx-hcell"></span>
    </div>

    <!-- ── EXPENSE LIST ── -->
    <div id="expense-list" style="transition: opacity 0.18s ease;">
      <div class="loading-text">Loading…</div>
    </div>

  </main>
</div>

<script src="/js/app.js"></script>
<script>
/* ── Populate month selector ── */
const MONTHS = [
  'January','February','March','April','May','June',
  'July','August','September','October','November','December'
];
const now = new Date();
const mSel = document.getElementById('f-month');
const ySel = document.getElementById('f-year');

MONTHS.forEach((m, i) => {
  const opt = document.createElement('option');
  opt.value = i + 1;
  opt.textContent = m;
  if (i + 1 === now.getMonth() + 1) opt.selected = true;
  mSel.appendChild(opt);
});

for (let y = now.getFullYear(); y >= now.getFullYear() - 5; y--) {
  const opt = document.createElement('option');
  opt.value = y;
  opt.textContent = y;
  if (y === now.getFullYear()) opt.selected = true;
  ySel.appendChild(opt);
}

/* ── Client-side search filter ── */
let allExpenses = [];

function applySearch() {
  const q = document.getElementById('f-search').value.trim().toLowerCase();
  const visible = q
    ? allExpenses.filter(e =>
        (e.description || '').toLowerCase().includes(q) ||
        (e.category    || '').toLowerCase().includes(q))
    : allExpenses;

  renderExpenses(visible);
}

/* ── Render list ── */
function renderExpenses(expenses) {
  const list      = document.getElementById('expense-list');
  const txHeader  = document.getElementById('tx-header');
  const countEl   = document.getElementById('result-count');

  // Fade out
  list.style.opacity = '0';

  setTimeout(() => {
    if (expenses.length === 0) {
      txHeader.style.display = 'none';
      list.innerHTML = buildEmptyState(
        'No Results',
        'Nothing matches your filters',
        'Try adjusting the category, month, or search term.',
        '/add.html', 'Add an Expense →'
      );
      countEl.textContent = '';
    } else {
      txHeader.style.display = '';
      list.innerHTML = expenses.map((e, i) =>
        buildTxRow(e, true, i * 45, false)
      ).join('');
      countEl.textContent = `${expenses.length} transaction${expenses.length !== 1 ? 's' : ''}`;
    }

    // Fade in
    list.style.opacity = '1';
  }, 160);
}

/* ── Load from API ── */
async function loadExpenses() {
  const cat   = document.getElementById('f-category').value;
  const month = document.getElementById('f-month').value;
  const year  = document.getElementById('f-year').value;

  let url = '/api/expenses';
  const params = new URLSearchParams();
  if (cat)   params.set('category', cat);
  if (month) params.set('month', month);
  if (year)  params.set('year', year);
  if (params.toString()) url += '?' + params.toString();

  try {
    const data  = await apiFetch(url);
    allExpenses = data.expenses || [];

    // Apply any existing search
    applySearch();
  } catch (err) {
    document.getElementById('expense-list').innerHTML = buildEmptyState(
      'Error',
      'Failed to load expenses',
      err.message || 'Please refresh the page.',
      null, null
    );
  }
}

/* ── Wire up filter controls ── */
['f-category', 'f-month', 'f-year'].forEach(id => {
  document.getElementById(id).addEventListener('change', loadExpenses);
});

/* ── Search (debounced) ── */
let searchTimer;
document.getElementById('f-search').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(applySearch, 250);
});

/* ── Initial load ── */
loadExpenses();
</script>
</body>
</html>
