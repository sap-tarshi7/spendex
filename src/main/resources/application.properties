spring.application.name=spendex-expense-tracker
server.port=8080

# Data file path (relative to working directory = project root)
expense.data.file=data/expenses.csv

# Jackson: serialize LocalDate as "2026-08-09" not [2026,8,9]
spring.jackson.serialization.write-dates-as-timestamps=false
# Logging
logging.level.com.expensetracker=INFO

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spendex?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
