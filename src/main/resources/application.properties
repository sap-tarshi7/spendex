spring.application.name=spendex-expense-tracker
server.port=8080

# Data file path (relative to working directory = project root)
expense.data.file=data/expenses.csv

# Jackson: serialize LocalDate as "2026-08-09" not [2026,8,9]
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging
logging.level.com.expensetracker=INFO
